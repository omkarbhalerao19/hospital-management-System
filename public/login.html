<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediCore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <h1>🏥 MediCore Care</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="active btn-nav">Login</a>
            </nav>
        </div>
    </header>

    <main class="container form-page">
        <div class="form-card">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Login to Account</button>
            </form>
            <p class="form-footer">Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('medicore_user', JSON.stringify(data.user));
                alert('Login successful!');
                window.location.href = 'dashboard.html';
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
