<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediCore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <h1>🏥 MediCore Care</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="btn-nav">Login</a>
            </nav>
        </div>
    </header>

    <main class="container form-page">
        <div class="form-card">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="role">
                        <option value="Patient">Patient / Resident</option>
                        <option value="Community Donor">Community Donor / Volunteer</option>
                        <option value="Doctor">Doctor / Medical Staff</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select id="bloodGroup">
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                        <option value="Not Known">Not Known</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+91 9876543210">
                </div>
                <button type="submit" class="btn-submit">Register Now</button>
            </form>
            <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                phone: document.getElementById('phone').value
            };
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('medicore_user', JSON.stringify(data.user));
                alert('Registration successful!');
                window.location.href = 'dashboard.html';
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
